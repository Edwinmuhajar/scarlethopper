name: ScarletHopper
version: '1.1.0'
main: com.scarlet.hopper.ScarletHopper
api-version: '1.21'
author: Scarlet
description: Hopper memindahkan banyak item sekaligus (default 32 per transfer).
commands:
  scarlethopper:
    description: Pengaturan ScarletHopper
    usage: /<command> <reload|set|info>
    aliases: [shopper]
